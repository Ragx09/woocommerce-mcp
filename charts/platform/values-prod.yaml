# VPS (k3s). Set global.domain at install time: --set global.domain=<ip>.sslip.io (or a real domain).
global:
  domain: CHANGE-ME.sslip.io
  scheme: https
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
  imageRegistry: ghcr.io/ragx09/
  imagePullPolicy: IfNotPresent
store:
  mariadb:
    storage: 5Gi
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 768Mi }
  wordpress:
    storage: 5Gi
