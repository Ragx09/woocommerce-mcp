{{- /* F-INF-4: one ServiceAccount per namespace for all our workloads, token automount off on the account
itself (pods also set it), and no Role or RoleBinding: nothing here talks to the Kubernetes API. The
namespace's "default" account stays unused. The store namespace's account comes with charts/store. */ -}}
{{- range $key := list "platform" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  namespace: {{ index $.Values.global.namespaces $key }}
  labels: {{- include "platform.labels" (dict "root" $ "app" "workload") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
