{{- if .Values.gateway.enabled }}
{{- $ns := .Values.global.namespaces.platform }}
{{- $ctx := dict "root" . "app" "netpol" }}
# Default deny: nothing in the platform namespace accepts traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Gateway ← Traefik only (public /api and /mcp). Egress stays open: it must reach upstream MCP
# servers, including remote ones (GitHub) and the LLM API; per-upstream SSRF checks live in code.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8080 }]
{{- end }}
{{- if .Values.gateway.enabled }}
---
# Postgres ← the gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-gateway
  namespace: {{ .Values.global.namespaces.platform }}
  labels: {{- include "platform.labels" (dict "root" . "app" "netpol") | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports: [{ port: 5432 }]
{{- end }}
