{{- if .Values.gateway.enabled }}
{{- $ns := .Values.global.namespaces.platform }}
{{- $v := .Values.gateway }}
{{- $ctx := dict "root" . "app" "gateway" }}
{{- $host := include "platform.host" (dict "root" . "host" $v.host) }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: {{ include "platform.image" (dict "root" . "image" $v.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: LOG_LEVEL, value: {{ $v.logLevel | quote }} }
            - { name: TRUST_PROXY_HOPS, value: "1" }   # Traefik
            - { name: UPSTREAM_CONNECT_TIMEOUT_MS, value: {{ $v.upstreamTimeouts.connect | quote }} }
            - { name: UPSTREAM_LIST_TIMEOUT_MS, value: {{ $v.upstreamTimeouts.list | quote }} }
            - { name: UPSTREAM_CALL_TIMEOUT_MS, value: {{ $v.upstreamTimeouts.call | quote }} }
            - { name: HEALTH_INTERVAL_MS, value: {{ $v.healthIntervalMs | quote }} }
            - { name: UPSTREAM_ALLOWED_HOSTS, value: {{ join "," $v.upstreamAllowedHosts | quote }} }   # SSRF allowlist (+ seeded hosts)
            - { name: PGHOST, value: "postgres.{{ $ns }}.svc.cluster.local" }
            - { name: PGUSER, value: gateway }
            - { name: PGDATABASE, value: gateway }
            - { name: DB_CONNECT_TIMEOUT_MS, value: "150000" }   # first install: Postgres pulls + initdb
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ $v.postgres.existingSecret }}, key: password } }
            - { name: COOKIE_SECURE, value: {{ eq .Values.global.scheme "https" | quote }} }
            - { name: PUBLIC_ORIGIN, value: {{ include "platform.url" (dict "root" . "host" $v.host) | quote }} }   # Origin check (AUTH-03)
            {{- if $v.adminSecret }}
            # AUTH-02: first admin, created only while the DB has no admin.
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ $v.adminSecret }}, key: admin-email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $v.adminSecret }}, key: admin-password } }
            {{- end }}
            # UI-13: chat agent LLM (D-012). The key comes only from the Secret; optional → chat disabled.
            - { name: LLM_BASE_URL, value: {{ $v.llm.baseUrl | quote }} }
            - { name: LLM_MODEL, value: {{ $v.llm.model | quote }} }
            - { name: LLM_TIMEOUT_MS, value: {{ $v.llm.timeoutMs | quote }} }
            - { name: LLM_MAX_OUTPUT, value: {{ $v.llm.maxTokens | quote }} }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $v.llm.existingSecret }}, key: api-key, optional: true } }
            - name: CREDENTIALS_KEY   # AES-256-GCM key for upstream credentials at rest (D-009)
              valueFrom: { secretKeyRef: { name: {{ $v.secrets }}, key: credentials-key } }
            {{- if and $v.seed.woo.enabled .Values.wooMcp.enabled }}
            # GW-03: register woo-mcp on first start (admin edits are never overwritten).
            - { name: SEED_WOO_URL, value: "http://woo-mcp.{{ .Values.global.namespaces.store }}.svc.cluster.local/mcp" }
            - { name: SEED_WOO_NAME, value: {{ $v.seed.woo.name | quote }} }
            - name: SEED_WOO_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $v.seed.secret }}, key: woo-token } }
            {{- end }}
            {{- if and $v.seed.everything.enabled .Values.everythingMcp.enabled }}
            - { name: SEED_EVERYTHING_URL, value: "http://everything-mcp.{{ $ns }}.svc.cluster.local/mcp" }
            - { name: SEED_EVERYTHING_NAME, value: {{ $v.seed.everything.name | quote }} }
            {{- end }}
            {{- if $v.seed.github.enabled }}
            - { name: SEED_GITHUB_URL, value: {{ $v.seed.github.url | quote }} }
            - { name: SEED_GITHUB_NAME, value: {{ $v.seed.github.name | quote }} }
            - name: SEED_GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $v.seed.secret }}, key: github-pat, optional: true } }
            {{- end }}
          securityContext: {{- include "platform.containerSecurity" . | nindent 12 }}
          # Migrations run before the server listens; give startup up to 3 min before liveness applies.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources: {{- include "platform.resources" (dict "name" "gateway" "resources" $v.resources) | nindent 12 }}
---
# app.<domain>: /api and /mcp → gateway, everything else → dashboard. The gateway probes (/healthz,
# /readyz) are not routed. /mcp is Prefix, not Exact: Traefik orders routers by the length of the rule
# text, so Path(`/mcp`) would lose to the dashboard's PathPrefix(`/`) and MCP clients would get nginx
# (found in UI-20). The gateway answers 404 for anything under /mcp/ other than /mcp itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
  {{- if .Values.global.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ $host }}]
      secretName: app-tls
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { name: http } } }
          {{- end }}
{{- end }}
