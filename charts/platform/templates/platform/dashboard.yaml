{{- if .Values.dashboard.enabled }}
{{- $ns := .Values.global.namespaces.platform }}
{{- $v := .Values.dashboard }}
{{- $ctx := dict "root" . "app" "dashboard" }}
# UI-20: the dashboard SPA (static files behind nginx). It holds no secrets and calls only its own
# origin; the Ingress `app` (gateway.yaml) sends `/` here and `/api`, `/mcp` to the gateway.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: workload   # F-INF-4: own account, no token, no RBAC
      {{- include "platform.pullSecrets" . | nindent 6 }}
      enableServiceLinks: false
      securityContext:
        runAsUser: 101           # nginx-unprivileged's nginx user
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: {{ include "platform.image" (dict "root" . "image" $v.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          securityContext: {{- include "platform.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx pid + temp files; the root filesystem is read-only
          resources: {{- include "platform.resources" (dict "name" "dashboard" "resources" $v.resources) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
# dashboard ← Traefik only; it makes no outbound connections (the browser calls the gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-from-ingress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" (dict "root" . "app" "netpol") | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: dashboard } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8080 }]
  egress: []
{{- end }}
