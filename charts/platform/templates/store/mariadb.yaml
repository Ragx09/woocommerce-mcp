{{- if .Values.store.enabled }}
{{- $ns := .Values.global.namespaces.store }}
{{- $m := .Values.store.mariadb }}
{{- $ctx := dict "root" . "app" "mariadb" }}
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels: {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: workload   # F-INF-4: own account, no token, no RBAC
      securityContext:
        runAsUser: 999      # mysql user in the official image; entrypoint supports running as it directly
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mariadb
          image: {{ $m.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $m.existingSecret }}, key: mariadb-password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $m.existingSecret }}, key: mariadb-root-password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writable: data volume, /run/mysqld, /tmp (REL-09)
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run, mountPath: /run/mysqld }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [healthcheck.sh, --connect] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- include "platform.resources" (dict "name" "mariadb" "resources" $m.resources) | nindent 12 }}
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "platform.labels" $ctx | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests: { storage: {{ $m.storage }} }
{{- end }}
