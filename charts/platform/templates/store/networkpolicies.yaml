{{- if .Values.store.enabled }}
{{- $ns := .Values.global.namespaces.store }}
{{- $pns := .Values.global.namespaces.platform }}
{{- $ctx := dict "root" . "app" "netpol" }}
# Default deny: nothing in the store namespace accepts traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# MariaDB ← WordPress and the wp-init Job only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-wordpress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wordpress } }
        - podSelector: { matchLabels: { app: wp-init } }
      ports: [{ port: 3306 }]
---
# WordPress ← Traefik (public storefront) and woo-mcp (REST API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-ingress-and-woo-mcp
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: wordpress } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - podSelector: { matchLabels: { app: woo-mcp } }
      ports: [{ port: 8080 }]   # the pod port (Service 80 → 8080)
---
# woo-mcp ← the gateway only (REQ-GW-01: nothing else talks to upstream MCP servers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-from-gateway
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: woo-mcp } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pns }} } }
          podSelector: { matchLabels: { app: gateway } }
      ports: [{ port: 8080 }]
  # woo-mcp may only reach WordPress and DNS.
  egress:
    - to:
        - podSelector: { matchLabels: { app: wordpress } }
      ports: [{ port: 8080 }]   # policies see the pod port after the Service translation
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# REL-04: cert-manager's HTTP-01 solver pod ← Traefik. Let's Encrypt fetches
# /.well-known/acme-challenge/ through a temporary Ingress; default-deny would otherwise drop it.
# Rendered always (matches no pod without TLS), so local and prod stay the same policy set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-from-ingress
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector: { matchLabels: { acme.cert-manager.io/http01-solver: "true" } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8089 }]
{{- end }}
