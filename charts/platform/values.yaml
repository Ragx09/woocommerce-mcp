# Defaults shared by every environment. values-local.yaml / values-prod.yaml override only
# what differs (domain, TLS, image registry and pull policy, storage, resources).
global:
  domain: 127.0.0.1.nip.io        # hosts are <name>.<domain>
  scheme: http                    # https when TLS terminates at the ingress
  ingressClassName: traefik
  storageClass: local-path
  tls:
    enabled: false
    clusterIssuer: ""             # cert-manager ClusterIssuer (prod)
  imageRegistry: ""               # prefix for our own images, e.g. ghcr.io/ragx09/
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []            # Secret names (docker-registry type) for imageRegistry, e.g. [ghcr-pull]
  namespaces:
    store: store
    platform: platform

store:
  enabled: true
  host: store                     # → store.<domain>
  mariadb:
    # SEC-06: third-party images pinned by digest (the upstream rebuilds a tag for OS patches; the digest is
    # the build Trivy scanned, docs/evidence/sec-06). Rebuilds younger than 2 weeks: security exception, D-024.
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    storage: 2Gi
    existingSecret: mariadb-secrets          # keys: mariadb-password, mariadb-root-password
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:d42f63cb89ad0eab272c4b393164e63830d0df270009907919f7dcce52b1a20b   # 2026-10-21 rebuild: 78 → 1 fixable HIGH
    storage: 2Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
  init:
    image: wordpress:cli-2.12.0-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
    woocommerceVersion: 11.2.1
    title: TATVA                             # current working brand concept (D-015, may change)
    currency: INR
    timezone: Asia/Kolkata
    country: "IN:KA"
    # BRD-06: TATVA theme + catalogue + images, shipped as an image and imported by wp-init.
    # Disabled → the plain store with three sample products (used before Phase 9).
    brand:
      enabled: true
      image:
        repository: store-assets
        tag: dev
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 64Mi }
    adminSecret: wordpress-admin             # keys: admin-user, admin-password, admin-email
    apiSecret: woo-api                       # keys: consumer-key, consumer-secret
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

wooMcp:
  enabled: true
  image:
    repository: woo-mcp
    tag: dev
  replicas: 1
  authSecret: woo-mcp-auth                   # key: token (the gateway holds the same value)
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

# GW-13: reference upstream server-everything (in the platform namespace, gateway-only).
everythingMcp:
  enabled: true
  image:
    repository: everything-mcp
    tag: dev
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }

# SEC-05: test-only upstream that misbehaves on purpose (services/hostile-mcp). Never enable it in a real
# install: scripts/sec/hostile.sh turns it on for the test run and off again. false in every values file.
hostileMcp:
  enabled: false
  image:
    repository: hostile-mcp
    tag: dev
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# UI-20: dashboard SPA at app.<domain>/ (same host as the gateway: same-origin cookie, no CORS).
dashboard:
  enabled: true
  image:
    repository: dashboard
    tag: dev
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 250m, memory: 64Mi }

gateway:
  enabled: true
  host: app                                  # → app.<domain>: /api and /mcp (the dashboard serves /)
  image:
    repository: gateway
    tag: dev
  # BON-04: 2 replicas; sessions, rate limits and the chat's busy lock live in Postgres, so any replica
  # can serve any request (stateless MCP). A PodDisruptionBudget keeps one up during node drains.
  replicas: 2
  # /mcp tools/call + tools/list per API key and per user (all keys) in each window, shared by all replicas
  # (Postgres). 0 = no limit. The dashboard chat has its own limits (30 messages / 10 min per user).
  rateLimit:
    perKey: 120
    perUser: 240
    windowMs: 60000
  logLevel: info
  # BON-03: Prometheus GET /metrics on its own port (pod only: no Service port, no Ingress route). Only pods
  # labelled metrics.scraper allowed in (any namespace). 0 → off.
  metrics:
    port: 9464
    scraperLabel: { platform.io/metrics-scraper: "true" }
  upstreamTimeouts:                          # ms (GW-09, docs/MCP_DESIGN.md §6)
    connect: 2000
    list: 3000
    call: 15000
  upstreamMaxResponseBytes: 4194304          # larger upstream responses are refused (T-08)
  maxToolsPerUpstream: 128                   # F-MCP-5: longer tool lists are cut (GitHub has 46)
  healthIntervalMs: 10000                    # upstream health loop (GW-10)
  # SSRF guard (T-06): admin-added servers may not resolve to internal addresses unless their host
  # name is listed here. The seeded servers' hosts (woo-mcp, everything-mcp) are allowed automatically.
  upstreamAllowedHosts: []
  secrets: gateway-secrets                   # key: credentials-key (64 hex chars)
  adminSecret: gateway-admin                 # keys: admin-email, admin-password — first admin (AUTH-02)
  seed:
    secret: upstream-seed                    # keys: woo-token, github-pat
    woo:
      enabled: true
      name: WooCommerce
      # BON-01: tools members may use on a fresh install (admins: all); [] → all. Editable in the dashboard.
      memberTools: [list_products, list_orders, get_order]
    everything:                              # GW-13: needs everythingMcp.enabled
      enabled: true
      name: Everything (reference)
      # F-MCP-2: every tool except get-env (it prints the pod's environment: Service IPs, pod name) for members.
      memberTools: [echo, get-annotated-message, get-resource-links, get-resource-reference, get-structured-content, get-sum,
        get-tiny-image, gzip-file-as-resource, toggle-simulated-logging, toggle-subscriber-updates,
        trigger-long-running-operation, simulate-research-query]
    github:                                  # GW-14: PAT from the seed Secret (key github-pat); empty → skipped
      enabled: true
      name: GitHub
      url: https://api.githubcopilot.com/mcp/
      # F-MCP-6 (SEC-08 R1): members get read-only GitHub tools only (no create/delete/push/merge/*_write
      # driven by the shared PAT, and not get_me — it reveals the shared identity, F-MCP-3). admins: all.
      # [] → all tools. Editable per upstream in the dashboard.
      memberTools: [get_commit, get_file_contents, get_label, get_latest_release, get_release_by_tag,
        get_tag, get_team_members, get_teams, issue_read, list_branches, list_commits, list_issue_fields,
        list_issue_types, list_issues, list_pull_requests, list_releases, list_repository_collaborators,
        list_tags, pull_request_read, search_code, search_commits, search_issues, search_pull_requests,
        search_repositories, search_users, ui_get]
  # UI-13 / D-012: chat agent LLM, any OpenAI-compatible chat-completions API. Switching provider is a
  # values change: OpenRouter → baseUrl https://openrouter.ai/api/v1, model openai/gpt-oss-120b:free.
  # The key lives only in the Secret (key api-key, from .env LLM_API_KEY); missing → chat disabled.
  llm:
    baseUrl: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    existingSecret: llm-secrets
    timeoutMs: 30000
    maxTokens: 1024
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 384Mi }
  postgres:
    image: postgres:16.15-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    storage: 1Gi
    existingSecret: postgres-secrets         # key: password (user and database: gateway)
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 384Mi }
