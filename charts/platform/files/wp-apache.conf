# F-WEB-4: no version banner (the image ships no security.conf, so Apache printed its full version).
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
  DocumentRoot /var/www/html
  ErrorLog ${APACHE_LOG_DIR}/error.log
  # F-WEB-11: no query strings in the access log. woo-mcp authenticates to the WooCommerce REST API with
  # OAuth 1.0a over the cluster network, which puts oauth_consumer_key (and the signature) in the query string;
  # storefront searches would be logged too. %U is the path only.
  LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_noquery
  CustomLog ${APACHE_LOG_DIR}/access.log combined_noquery
  <Directory /var/www/html>
    Options -Indexes
  </Directory>
  # F-WEB-2: XML-RPC is not used (no apps, no pingbacks); system.multicall amplifies password guessing.
  <Files "xmlrpc.php">
    Require all denied
  </Files>
  # F-WEB-4: files that only reveal the WordPress version (wp-links-opml.php: F-WEB-7, the links
  # manager is not used).
  <FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|wp-links-opml\.php)$">
    Require all denied
  </FilesMatch>
  # SEC-07 / F-WEB-8: security headers on every response (PHP pages and static files). The CSP only
  # restricts what cannot break WordPress or the checkout: framing, plugins, <base>, form targets.
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
  Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
  # HSTS only when the request came in over TLS (Traefik terminates it on the VPS).
  Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
  # F-WEB-10: WordPress and WooCommerce set their cookies without SameSite: add Lax to any cookie that has none
  # (both tables: PHP's headers live in the default one, error and redirect answers in "always").
  # One lookahead at the start: a per-character lookahead made Apache's children segfault (PCRE recursion).
  Header always edit Set-Cookie "^(?!.*;\s*[Ss]ame[Ss]ite=)(.+)$" "$1; SameSite=Lax"
  Header edit Set-Cookie "^(?!.*;\s*[Ss]ame[Ss]ite=)(.+)$" "$1; SameSite=Lax"
</VirtualHost>
