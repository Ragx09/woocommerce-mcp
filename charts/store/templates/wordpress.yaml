{{- $ns := include "store.namespace" . }}
{{- $w := .Values.wordpress }}
{{- $ctx := dict "root" . "app" "wordpress" }}
{{- $home := include "store.url" (dict "root" . "host" .Values.host) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  namespace: {{ $ns }}
  labels: {{- include "store.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests: { storage: {{ $w.storage }} }
---
# REL-09: Apache listens on 8080 so the container can run as www-data (no root, no capabilities).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-apache
  namespace: {{ $ns }}
  labels: {{- include "store.labels" $ctx | nindent 4 }}
data:
  ports.conf: |
    Listen 8080
  # SEC-07: mod_headers (shipped with the image, not enabled) for the security headers below.
  headers.load: |
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
  000-default.conf: |
{{ .Files.Get "files/wp-apache.conf" | indent 4 }}
  # F-WEB-4: no X-Powered-By: PHP/<version>.
  zz-security.ini: |
    expose_php = Off
  # F-WEB-1/3/5: no user enumeration (must-use plugin, see files/wp-hardening.php).
  platform-hardening.php: |
{{ .Files.Get "files/wp-hardening.php" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels: {{- include "store.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "store.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels: {{- include "store.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }   # ReadWriteOnce volume
  selector:
    matchLabels: {{- include "store.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" $ctx | nindent 8 }}
      annotations:   # subPath mounts never pick up ConfigMap edits: roll the pod when they change
        checksum/hardening: {{ .Files.Get "files/wp-hardening.php" | sha256sum | trunc 16 }}
        checksum/apache: {{ .Files.Get "files/wp-apache.conf" | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: workload   # F-INF-4: own account, no token, no RBAC
      securityContext:
        runAsNonRoot: true
        runAsUser: 33        # www-data, owner of the files on the data volume
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wordpress
          image: {{ $w.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.mariadb.existingSecret }}, key: mariadb-password } }
            - { name: WP_HOME, value: {{ $home | quote }} }
            # Pin the canonical URL to the Ingress host (no redirect loops when reached via the
            # internal Service) and trust X-Forwarded-Proto from Traefik for HTTPS on the VPS.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', getenv('WP_HOME'));
                define('WP_SITEURL', getenv('WP_HOME'));
                if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $_SERVER['HTTPS'] = 'on'; }
                define('DISALLOW_FILE_EDIT', true);
                // F-WEB-1/3/5 hardening must-use plugin, mounted read-only outside the data volume.
                define('WPMU_PLUGIN_DIR', '/var/www/platform-mu-plugins');
                // F-INF-2: the pod has no internet egress; fail external HTTP at once instead of waiting
                // for a timeout. WP-CLI (wp-init) may still download WooCommerce.
                define('WP_HTTP_BLOCK_EXTERNAL', PHP_SAPI !== 'cli');
          # Runs as www-data on 8080 (REL-09): no capabilities, read-only image; writable paths are the
          # data volume and emptyDirs for Apache's pid/lock files and PHP's temp files.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
            - { name: apache, mountPath: /etc/apache2/ports.conf, subPath: ports.conf, readOnly: true }
            - { name: apache, mountPath: /etc/apache2/mods-enabled/headers.load, subPath: headers.load, readOnly: true }
            - { name: apache, mountPath: /etc/apache2/sites-enabled/000-default.conf, subPath: 000-default.conf, readOnly: true }
            - { name: apache, mountPath: /usr/local/etc/php/conf.d/zz-security.ini, subPath: zz-security.ini, readOnly: true }
            # Not inside the data volume: a subPath mount there makes the kubelet create wp-content/ as root before
            # the image copies WordPress in, and www-data then cannot populate it (fresh installs broke, BON-09).
            - { name: mu-plugins, mountPath: /var/www/platform-mu-plugins, readOnly: true }
            - { name: run, mountPath: /var/run/apache2 }
            - { name: lock, mountPath: /var/lock/apache2 }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            # 200 once installed, 302 to install.php before that; 500 when the database is down.
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- include "store.resources" (dict "name" "wordpress" "resources" $w.resources) | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wordpress-data }
        - name: apache
          configMap: { name: wordpress-apache }
        - name: mu-plugins
          configMap: { name: wordpress-apache, items: [{ key: platform-hardening.php, path: platform-hardening.php }] }
        - { name: run, emptyDir: { sizeLimit: 16Mi } }
        - { name: lock, emptyDir: { sizeLimit: 16Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: {{ $ns }}
  labels: {{- include "store.labels" $ctx | nindent 4 }}
  {{- if .Values.global.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ include "store.host" (dict "root" . "host" .Values.host) }}]
      secretName: store-tls
  {{- end }}
  rules:
    - host: {{ include "store.host" (dict "root" . "host" .Values.host) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: wordpress, port: { name: http } } }
