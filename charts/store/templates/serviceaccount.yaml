{{- /* F-INF-4: one ServiceAccount for all workloads of the store, token automount off on the account itself
(pods also set it), and no Role or RoleBinding: nothing in a store talks to the Kubernetes API. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  namespace: {{ include "store.namespace" . }}
  labels: {{- include "store.labels" (dict "root" . "app" "workload") | nindent 4 }}
automountServiceAccountToken: false
