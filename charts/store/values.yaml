# One store (D-026). The platform chart installs the default store with these values under `store:`; the
# provisioner installs every created store (`store-<slug>` namespace) with per-store overrides (BON-11).
# global: shared with the parent chart when used as a dependency; these defaults apply standalone.
global:
  domain: 127.0.0.1.nip.io
  scheme: http
  ingressClassName: traefik
  storageClass: local-path
  tls:
    enabled: false
    clusterIssuer: ""
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

namespace: ""                     # "" → the release namespace
gatewayNamespace: platform        # woo-mcp accepts connections only from the gateway pods there
labels:
  partOf: store
  chart: ""                       # "" → store-<version>
  store: ""                       # set for provisioned stores → label platform.io/store=<slug>
host: store                     # → store.<domain>
mariadb:
  # SEC-06: third-party images pinned by digest (the upstream rebuilds a tag for OS patches; the digest is
  # the build Trivy scanned, docs/evidence/sec-06). Rebuilds younger than 2 weeks: security exception, D-024.
  image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
  storage: 2Gi
  existingSecret: mariadb-secrets          # keys: mariadb-password, mariadb-root-password
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }
wordpress:
  image: wordpress:7.1.3-php8.3-apache@sha256:d42f63cb89ad0eab272c4b393164e63830d0df270009907919f7dcce52b1a20b   # 2026-10-21 rebuild: 78 → 1 fixable HIGH
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }
init:
  image: wordpress:cli-2.12.0-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
  woocommerceVersion: 11.2.1
  title: TATVA                             # current working brand concept (D-015, may change)
  # BON-11: set by the provisioner for created stores; empty for the default TATVA store.
  tagline: ""
  niche: ""                                # stationery | tea-coffee | home-ceramics | bags | bike | custom
  nicheText: ""                            # custom niche: the only category
  currency: INR
  timezone: Asia/Kolkata
  country: "IN:KA"
  # BRD-06: TATVA theme + catalogue + images, shipped as an image and imported by wp-init.
  # Disabled → the plain store with three sample products (used before Phase 9).
  brand:
    enabled: true
    image:
      repository: store-assets
      tag: dev
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: 200m, memory: 64Mi }
  adminSecret: wordpress-admin             # keys: admin-user, admin-password, admin-email
  apiSecret: woo-api                       # keys: consumer-key, consumer-secret
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

wooMcp:
  enabled: true
  image:
    repository: woo-mcp
    tag: dev
  replicas: 1
  authSecret: woo-mcp-auth                   # key: token (the gateway holds the same value)
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

# BON-14: ResourceQuota + LimitRange for created stores (the provisioner turns it on; the default store has none).
quota:
  enabled: false
  limits: { cpu: "4", memory: 3Gi }   # the containers' limits add up to ~3 CPU / ~1.9 GiB
  requests: { cpu: "1", memory: 1536Mi }
  storage: 6Gi
