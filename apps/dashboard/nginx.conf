# UI-20: static SPA. /api and /mcp never reach this server (the Ingress sends them to the gateway).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The app needs nothing outside its own origin: no inline scripts or styles, no third-party hosts,
    # and it may not be framed (clickjacking). `add_header` is not inherited into a location that sets
    # its own headers, so the set is an include.
    include /etc/nginx/security-headers.conf;

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";   # content-hashed names
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;    # client-side routes (/servers, /invite …) load the app
    }
}
